name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Compiles with Error Prone and NullAway, runs the tests against PostgreSQL, Kafka, Redis and
      # RustFS (S3) in Testcontainers (Docker is available on GitHub's runners), checks module
      # boundaries and formatting.
      - run: ./mvnw -B verify
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API client matches api/openapi.yaml
        run: |
          npm run api:generate
          git diff --exit-code -- src/shared/api/generated
      - run: npm run check
      - run: npm run build

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Conventional commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint with each set of values
        run: |
          for values in values.yaml values-kind.yaml values-production.yaml; do
            helm lint --strict deploy/helm/ledgerline -f deploy/helm/ledgerline/$values \
              --set secrets.databasePassword=lint
          done
      # Every rendered object must be valid for Kubernetes 1.33 (CRDs such as ServiceMonitor and
      # HTTPRoute are checked against the community schema catalogue).
      - name: Validate the rendered manifests
        run: |
          for values in values.yaml values-kind.yaml values-production.yaml; do
            helm template ledgerline deploy/helm/ledgerline -f deploy/helm/ledgerline/$values \
              --set secrets.databasePassword=lint > "rendered-$values"
          done
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered-*.yaml

  kubernetes:
    name: Deploy to Kubernetes (kind)
    runs-on: ubuntu-latest
    needs: [backend, frontend, chart]
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: ledgerline
      - name: Build the images and load them into the cluster
        run: |
          docker build -t ledgerline-backend:dev backend
          docker build -t ledgerline-frontend:dev frontend
          kind load docker-image --name ledgerline ledgerline-backend:dev ledgerline-frontend:dev
      - name: Install the chart
        run: |
          helm install ledgerline deploy/helm/ledgerline \
            -f deploy/helm/ledgerline/values-kind.yaml --wait --timeout 10m
      - name: helm test
        run: helm test ledgerline --logs
      - name: Sign in through the frontend
        run: |
          kubectl port-forward svc/ledgerline-frontend 8000:80 &
          sleep 3
          # Get a CSRF token, then sign in as the demo user and list their wallets.
          curl -fsS -c cookies -b cookies http://localhost:8000/api/v1/auth/me -o /dev/null -w '%{http_code}\n' || true
          token=$(awk '$6 == "XSRF-TOKEN" { print $7 }' cookies)
          curl -fsS -c cookies -b cookies -H "X-XSRF-TOKEN: $token" -H 'Content-Type: application/json' \
            -d '{"email":"demo@ledgerline.dev","password":"ledgerline-demo"}' \
            http://localhost:8000/api/v1/auth/sign-in
          echo
          curl -fsS -b cookies http://localhost:8000/api/v1/wallets
      - name: Cluster state
        if: always()
        run: |
          kubectl get pods,svc,pvc -o wide
          kubectl logs deploy/ledgerline-backend --tail=200 || true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the whole app
        run: docker compose up -d --build --wait
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
      - name: App logs
        if: failure()
        run: docker compose logs --tail=300
