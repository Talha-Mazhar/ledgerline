# Services the backend needs during development. `./mvnw spring-boot:run` starts them through
# Spring Boot's Docker Compose support; ports match application.yaml.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ledgerline
      MINIO_ROOT_PASSWORD: ledgerline-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    labels:
      org.springframework.boot.ignore: true

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "1025:1025"
      - "8025:8025"
    labels:
      org.springframework.boot.ignore: true

  # The AI assistant's model. Optional and large (about 2 GB): start it with
  #   docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    labels:
      org.springframework.boot.ignore: true

  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]
    labels:
      org.springframework.boot.ignore: true

volumes:
  postgres-data:
  minio-data:
  ollama-data:
