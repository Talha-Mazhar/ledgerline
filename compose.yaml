# The whole of Ledgerline in containers: PostgreSQL, the backend and the frontend.
#
#   docker compose up --build      then open http://localhost:8000
#
# For development, run the backend and frontend from your IDE instead (see the README); they use
# infra/compose.yaml for PostgreSQL only.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: ledgerline
      SPRING_DATASOURCE_PASSWORD: ledgerline
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
