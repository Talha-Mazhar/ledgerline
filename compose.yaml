# The whole of Ledgerline in containers.
#
#   docker compose up --build                     the app: http://localhost:8000
#   docker compose --profile observability up    + Grafana http://localhost:3000 (admin/admin),
#                                                   Prometheus :9090, Tempo for traces
#   docker compose --profile ai up                + the assistant's model (Ollama, ~2 GB)
#
# Mailpit shows the emails the app sends: http://localhost:8025. The storage console (RustFS): :9001.
# For development, run the backend and frontend from your IDE instead (see the README); they use
# infra/compose.yaml.

x-backend-env: &backend-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
  SPRING_DATASOURCE_USERNAME: ledgerline
  SPRING_DATASOURCE_PASSWORD: ledgerline
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  SPRING_DATA_REDIS_HOST: redis
  SPRING_MAIL_HOST: mailpit
  SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
  SPRING_DOCKER_COMPOSE_ENABLED: "false"
  LEDGERLINE_DOCUMENTS_ENDPOINT: http://storage:9000
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage (RustFS) for identity documents and statements.
  storage:
    image: rustfs/rustfs:1.0.4
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ledgerline
      RUSTFS_SECRET_KEY: ledgerline-secret
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9001:9001"
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The backend creates its bucket when storage answers; it needn't wait for it.
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "8000:8080"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]

  prometheus:
    image: prom/prometheus:v3.7.2
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]

volumes:
  postgres-data:
  storage-data:
  ollama-data:
