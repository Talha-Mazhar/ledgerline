spring:
  application:
    name: ledgerline
  docker:
    compose:
      file: ../infra/compose.yaml
      lifecycle-management: start-only
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledgerline-notifications
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 1025
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "ledgerline:"
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
        options:
          model: llama3.2:3b
          temperature: 0.1
  modulith:
    events:
      # Send events that were stored but not yet delivered (e.g. Kafka was down) again at start-up.
      republish-outstanding-events-on-restart: true
      externalization:
        # One send at a time while resubmitting, so a backlog can't reorder a payment's events.
        serialize-externalization: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: LEDGERLINE_SESSION
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ledgerline:
  fx:
    feed-url: https://api.frankfurter.dev/v1
    timeout: 5s
  documents:
    endpoint: http://localhost:9000
    region: eu-central-1
    bucket: ledgerline-documents
    access-key: ledgerline
    secret-key: ledgerline-secret
  risk:
    basic:
      single-payment: 1000
      daily: 2000
    verified:
      single-payment: 10000
      daily: 25000
    velocity-window: 10m
    velocity-max-payments: 5
    new-recipient-threshold: 500
