{{- $b := .Values.backend }}
{{- $name := include "ledgerline.component" (dict "root" . "component" "backend") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  {{- if not $b.autoscaling.enabled }}
  replicas: {{ $b.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledgerline.selectorLabels" (dict "root" . "component" "backend") | nindent 8 }}
      annotations:
        # Restart the pods when their configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "ledgerline.podSecurityContext" . | nindent 8 }}
      # Spring Boot shuts down gracefully: in-flight requests finish, Kafka listeners stop.
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: {{ include "ledgerline.image" (dict "root" . "image" $b.image) }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          envFrom:
            - configMapRef:
                name: {{ $name }}
            {{- range $b.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "ledgerline.secretName" . }}, key: database-password } }
            - name: LEDGERLINE_DOCUMENTS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ include "ledgerline.secretName" . }}, key: documents-access-key } }
            - name: LEDGERLINE_DOCUMENTS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ include "ledgerline.secretName" . }}, key: documents-secret-key } }
            - name: SPRING_MAIL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "ledgerline.secretName" . }}, key: mail-password, optional: true } }
          # Start-up runs Flyway migrations; give it up to 3 minutes before liveness counts.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the Service stop routing to the pod before the app starts shutting down.
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- include "ledgerline.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $b.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $b.affinity }}
      affinity:
        {{- toYaml $b.affinity | nindent 8 }}
      {{- else }}
      # Spread replicas over nodes, so losing one node never takes the whole backend down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ledgerline.selectorLabels" (dict "root" . "component" "backend") | nindent 14 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  selector:
    {{- include "ledgerline.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 8081, targetPort: management }
{{- if $b.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $b.autoscaling.minReplicas }}
  maxReplicas: {{ $b.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $b.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if $b.podDisruptionBudget }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledgerline.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  minAvailable: {{ $b.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ledgerline.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
{{- end }}
