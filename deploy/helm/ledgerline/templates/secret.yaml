{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledgerline.secretName" . }}
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  annotations:
    # Keep the passwords if the release is uninstalled, so the database volume stays usable.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if .Values.infrastructure.enabled }}
  {{- /* In-cluster services: generate passwords once and keep them across upgrades. */}}
  database-password: {{ include "ledgerline.secretValue" (dict "root" . "key" "database-password" "value" $s.databasePassword) }}
  documents-access-key: {{ include "ledgerline.secretValue" (dict "root" . "key" "documents-access-key" "value" $s.documentsAccessKey) }}
  documents-secret-key: {{ include "ledgerline.secretValue" (dict "root" . "key" "documents-secret-key" "value" $s.documentsSecretKey) }}
{{- else }}
  {{- /* Managed services: their credentials come from values. Empty S3 keys mean "use the pod's role". */}}
  database-password: {{ required "secrets.databasePassword (or secrets.existingSecret) is required for an external database" $s.databasePassword | b64enc | quote }}
  documents-access-key: {{ $s.documentsAccessKey | b64enc | quote }}
  documents-secret-key: {{ $s.documentsSecretKey | b64enc | quote }}
{{- end }}
  mail-password: {{ $s.mailPassword | b64enc | quote }}
{{- end }}
