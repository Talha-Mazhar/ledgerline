{{- if .Values.ingress.enabled }}
{{- $i := .Values.ingress }}
# Everything goes to the frontend's nginx, which serves the app and forwards /api to the backend.
# The backend's management port (8081: health, metrics) is never exposed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ledgerline.fullname" . }}
  labels:
    {{- include "ledgerline.labels" . | nindent 4 }}
  {{- with $i.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $i.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $i.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ledgerline.component" (dict "root" . "component" "frontend") }}
                port: { name: http }
{{- end }}
