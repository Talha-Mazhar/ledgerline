openapi: 3.0.3
info:
  title: Ledgerline API
  version: 0.6.0
  description: |
    The contract between the Ledgerline backend and its clients. The frontend generates its types and
    client from this file, and the backend's tests check every response against it.

    Errors use RFC 9457 problem details (`application/problem+json`). Amounts are decimal strings,
    never floating-point numbers.

    Signing in starts a session held in an `HttpOnly` cookie. Every endpoint except sign-up and
    sign-in needs that session and answers 401 without it. Requests that change something (POST)
    must also send the CSRF token: copy the `XSRF-TOKEN` cookie's value into an `X-XSRF-TOKEN`
    header. Without it the server answers 403.
servers:
  - url: /api/v1

tags:
  - name: Auth
    description: Sign-up, sign-in and the signed-in user.
  - name: Wallets
    description: One wallet per currency for the signed-in user.
  - name: Money movements
    description: Everything that moves money. Each one is a balanced entry in the ledger.
  - name: Exchange
    description: Changing money between currencies at Ledgerline's rates.
  - name: Transfers
    description: Sending money to other Ledgerline users.
  - name: Payments
    description: Every payment a customer made or received, and where it stands.
  - name: Notifications
    description: What happened to the customer's money, delivered through Kafka.
  - name: Verification
    description: Identity verification (KYC) and the limits that depend on it.
  - name: Back office
    description: Tools for support staff and admins. Customers get 403.

paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: The account was created and its session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password. The answer never says which.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the session
      responses:
        '204':
          description: Signed out. Also answered when there was no session.
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: The signed-in user
      responses:
        '200':
          description: The user this session belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /wallets:
    get:
      tags: [Wallets]
      operationId: listWallets
      summary: List the user's wallets
      responses:
        '200':
          description: The user's wallets, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Open a wallet in a currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
      responses:
        '201':
          description: The wallet was opened with a zero balance.
          headers:
            Location:
              description: URL of the new wallet.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The user already has a wallet in this currency.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /wallets/{walletId}:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Get one wallet
      responses:
        '200':
          description: The wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'

  /wallets/{walletId}/deposits:
    parameters:
      - $ref: '#/components/parameters/WalletId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Money movements]
      operationId: depositMoney
      summary: Add money to a wallet
      description: |
        Simulates a card top-up: the money enters the ledger from Ledgerline's funding account.
        Sending the same Idempotency-Key again returns the original result instead of adding the
        money twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '201':
          description: The money was added. The item is the wallet's new activity line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /wallets/{walletId}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/WalletId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Money movements]
      operationId: withdrawMoney
      summary: Withdraw money from a wallet
      description: Simulates a payout to the user's bank account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '201':
          description: The money was withdrawn. The item is the wallet's new activity line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /wallets/{walletId}/activity:
    parameters:
      - $ref: '#/components/parameters/WalletId'
    get:
      tags: [Wallets]
      operationId: listWalletActivity
      summary: One wallet's activity, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The wallet's activity lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'

  /activity:
    get:
      tags: [Wallets]
      operationId: listActivity
      summary: Activity across all the user's wallets, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The activity lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /exchange-rates:
    get:
      tags: [Exchange]
      operationId: getExchangeRate
      summary: The rate for changing one currency into another
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CurrencyCode'
      responses:
        '200':
          description: The rate Ledgerline offers, and the mid-market rate it's based on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /exchanges/quote:
    post:
      tags: [Exchange]
      operationId: quoteExchange
      summary: Preview an exchange without moving money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: What the user would sell and get.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'

  /exchanges:
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Exchange]
      operationId: exchangeMoney
      summary: Exchange money between two of the user's wallets
      description: |
        One journal entry in two currencies: the sold money goes to Ledgerline's FX account in that
        currency, and the FX account in the other currency pays out the bought money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '201':
          description: The money was exchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exchange'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/WalletNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /transfers:
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Transfers]
      operationId: sendMoney
      summary: Send money to another user
      description: |
        One journal entry: the sender's wallet pays, the recipient's wallet in the same currency
        receives. The recipient is found by email and needs a wallet in that currency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '201':
          description: The money was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The user has no wallet with this id, or nobody uses the recipient's email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/users:
    get:
      tags: [Back office]
      operationId: listUsers
      summary: Find users by email or name
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Up to 50 matching users, by email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /back-office/users/{userId}/role:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Back office]
      operationId: changeUserRole
      summary: Change a user's role (admins only)
      description: Takes effect the next time the user signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: The user with the new role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no user with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /payments:
    get:
      tags: [Payments]
      operationId: listPayments
      summary: The customer's payments, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payments the customer made, and transfers they received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: The latest notifications and how many are unread
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      responses:
        '204':
          description: Marked as read.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification as read
      responses:
        '204':
          description: All marked as read.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /verification:
    get:
      tags: [Verification]
      operationId: getVerification
      summary: Where the customer's identity verification stands
      responses:
        '200':
          description: The verification, or NOT_STARTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Verification]
      operationId: submitVerification
      summary: Upload an identity document for review
      description: A PDF, JPEG or PNG of up to 5 MB, checked by its content, not its name.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '202':
          description: Received; waiting for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /limits:
    get:
      tags: [Verification]
      operationId: getLimits
      summary: What the customer may send without approval
      responses:
        '200':
          description: The limits for the customer's tier, in euros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limits'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /back-office/payments:
    get:
      tags: [Back office]
      operationId: listStaffPayments
      summary: The approval queue, or payments by status
      parameters:
        - name: status
          in: query
          required: false
          description: Without it, the payments waiting for approval, oldest first.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Up to 100 payments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPaymentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /back-office/payments/{paymentId}/approve:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Back office]
      operationId: approvePayment
      summary: Approve a held payment
      description: |
        The first approval moves it to AWAITING_SECOND_APPROVAL; the second, by a different staff
        member, releases the money. Nobody can approve their own payment.
      responses:
        '200':
          description: The payment after the approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no payment with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/payments/{paymentId}/reject:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Back office]
      operationId: rejectPayment
      summary: Reject a held payment and return the money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: The rejected payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no payment with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/payments/{paymentId}/refund:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Back office]
      operationId: refundPayment
      summary: Refund a completed transfer or top-up
      responses:
        '200':
          description: The original payment, now REFUNDED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPayment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no payment with this id.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/verifications:
    get:
      tags: [Back office]
      operationId: listVerificationsToReview
      summary: Identity documents waiting for review, oldest first
      responses:
        '200':
          description: The review queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /back-office/verifications/{userId}/document:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Back office]
      operationId: getVerificationDocument
      summary: The uploaded identity document
      responses:
        '200':
          description: The file, as uploaded.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This user has not submitted a document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /back-office/verifications/{userId}/approve:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Back office]
      operationId: approveVerification
      summary: Confirm a customer's identity
      responses:
        '200':
          description: The verification, now VERIFIED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This user has not submitted a document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/verifications/{userId}/reject:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Back office]
      operationId: rejectVerification
      summary: Refuse a document, with a reason for the customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: The verification, now REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This user has not submitted a document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /back-office/audit:
    get:
      tags: [Back office]
      operationId: listAuditEntries
      summary: The latest back-office actions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  parameters:
    WalletId:
      name: walletId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique id the client creates for each money movement it wants to make (a UUID). If the
        request is retried with the same key, the original result is returned and the money moves
        only once.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: How many lines to return, newest first.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    Unauthenticated:
      description: No signed-in session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The request was refused, for example because the CSRF token is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request is malformed, for example an unknown currency or an invalid id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WalletNotFound:
      description: The user has no wallet with this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used for a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RuleViolation:
      description: The request is well-formed but breaks a business rule, e.g. not enough money.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CurrencyCode:
      type: string
      description: ISO 4217 code of a currency Ledgerline supports.
      enum: [EUR, USD, CZK, GBP]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount with exactly two decimal places, e.g. "1250.00".
          pattern: '^-?\d+\.\d{2}$'
          example: '1250.00'
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    WalletStatus:
      type: string
      enum: [ACTIVE]

    Wallet:
      type: object
      required: [id, currency, balance, status, openedAt]
      properties:
        id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        balance:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/WalletStatus'
        openedAt:
          type: string
          format: date-time

    WalletList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'

    OpenWalletRequest:
      type: object
      required: [currency]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          description: A positive amount with up to two decimal places, e.g. "250" or "250.50".
          pattern: '^\d{1,9}(\.\d{1,2})?$'
          example: '250.00'

    ActivityKind:
      type: string
      description: |
        What moved the money, from this wallet's point of view. HELD is money set aside while a
        payment waits for approval; RELEASED is held money returned after a rejection.
      enum: [DEPOSIT, WITHDRAWAL, EXCHANGE_OUT, EXCHANGE_IN, TRANSFER_OUT, TRANSFER_IN, HELD, RELEASED, REFUND_OUT, REFUND_IN]

    ActivityItem:
      type: object
      description: One line of a wallet's ledger.
      required: [id, entryId, walletId, kind, description, amount, balanceAfter, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: The ledger posting this line comes from.
        entryId:
          type: string
          format: uuid
          description: The journal entry the posting belongs to.
        walletId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActivityKind'
        description:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
          description: Positive for money in, negative for money out.
        balanceAfter:
          $ref: '#/components/schemas/Money'
        occurredAt:
          type: string
          format: date-time

    ActivityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityItem'

    Rate:
      type: string
      description: Units of the bought currency per one unit of the sold currency, six decimals.
      pattern: '^\d+\.\d{6}$'
      example: '25.024250'

    ExchangeRate:
      type: object
      required: [from, to, rate, midRate, asOf]
      properties:
        from:
          $ref: '#/components/schemas/CurrencyCode'
        to:
          $ref: '#/components/schemas/CurrencyCode'
        rate:
          $ref: '#/components/schemas/Rate'
        midRate:
          $ref: '#/components/schemas/Rate'
        asOf:
          type: string
          format: date-time

    ExchangeRequest:
      type: object
      required: [fromWalletId, toWalletId, amount]
      properties:
        fromWalletId:
          type: string
          format: uuid
        toWalletId:
          type: string
          format: uuid
        amount:
          type: string
          description: How much to sell, in the from-wallet's currency.
          pattern: '^\d{1,9}(\.\d{1,2})?$'

    ExchangeQuote:
      type: object
      required: [sell, buy, rate]
      properties:
        sell:
          $ref: '#/components/schemas/Money'
        buy:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Rate'

    Exchange:
      type: object
      required: [entryId, sell, buy, rate]
      properties:
        entryId:
          type: string
          format: uuid
        sell:
          $ref: '#/components/schemas/ActivityItem'
        buy:
          $ref: '#/components/schemas/ActivityItem'
        rate:
          $ref: '#/components/schemas/Rate'

    Role:
      type: string
      description: CUSTOMER uses their own wallets; SUPPORT and ADMIN work the back office.
      enum: [CUSTOMER, SUPPORT, ADMIN]

    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    StaffUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    StaffUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffUser'

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'

    SignUpRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email:
          type: string
          maxLength: 254
        displayName:
          type: string
          maxLength: 80
        password:
          type: string
          description: 10 to 64 characters.

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    TransferRequest:
      type: object
      required: [fromWalletId, recipientEmail, amount]
      properties:
        fromWalletId:
          type: string
          format: uuid
        recipientEmail:
          type: string
          description: The email the recipient signed up with.
        amount:
          type: string
          description: How much to send, in the from-wallet's currency.
          pattern: '^\d{1,9}(\.\d{1,2})?$'

    Recipient:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
        displayName:
          type: string

    Transfer:
      type: object
      required: [activity, recipient, paymentId, status]
      properties:
        activity:
          $ref: '#/components/schemas/ActivityItem'
          description: The sender's new line.
        recipient:
          $ref: '#/components/schemas/Recipient'
        paymentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'

    PaymentKind:
      type: string
      enum: [DEPOSIT, WITHDRAWAL, TRANSFER, EXCHANGE, REFUND]

    PaymentStatus:
      type: string
      description: |
        COMPLETED: the money moved. HELD: waiting for a first staff approval.
        AWAITING_SECOND_APPROVAL: one approval given; a second, different person must approve.
        REJECTED: not approved, money returned. REFUNDED: reversed by staff.
      enum: [COMPLETED, HELD, AWAITING_SECOND_APPROVAL, REJECTED, REFUNDED]

    Payment:
      type: object
      required: [id, kind, status, direction, description, amount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PaymentKind'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        direction:
          type: string
          enum: [IN, OUT]
        description:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        holdReason:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

    Party:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string

    StaffPayment:
      type: object
      required: [id, kind, status, amount, customer, refundable, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PaymentKind'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        customer:
          $ref: '#/components/schemas/Party'
        counterparty:
          allOf:
            - $ref: '#/components/schemas/Party'
          nullable: true
        holdReason:
          type: string
          nullable: true
        firstApprover:
          type: string
          nullable: true
        secondApprover:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        refundable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StaffPaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffPayment'

    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Shown to the customer. Up to 500 characters.

    Notification:
      type: object
      required: [id, kind, title, body, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        link:
          type: string
          nullable: true
          description: The page of the app the notification is about, e.g. /payments.
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

    NotificationList:
      type: object
      required: [unread, items]
      properties:
        unread:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    VerificationStatus:
      type: string
      enum: [NOT_STARTED, PENDING_REVIEW, VERIFIED, REJECTED]

    Tier:
      type: string
      description: BASIC until the identity is verified, then VERIFIED, with higher limits.
      enum: [BASIC, VERIFIED]

    Verification:
      type: object
      required: [status, tier]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        tier:
          $ref: '#/components/schemas/Tier'
        documentName:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true

    Limits:
      type: object
      required: [tier, singlePayment, daily, currency]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        singlePayment:
          type: string
          description: The most one payment may be without approval, in euros.
        daily:
          type: string
          description: The most all payments of the last 24 hours may add up to without approval.
        currency:
          type: string
          enum: [EUR]

    ReviewItem:
      type: object
      required: [userId, email, displayName, status, documentName, contentType, submittedAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        status:
          $ref: '#/components/schemas/VerificationStatus'
        documentName:
          type: string
        contentType:
          type: string
        submittedAt:
          type: string
          format: date-time

    ReviewQueue:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItem'

    AuditEntry:
      type: object
      required: [id, action, targetType, targetId, details, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
          nullable: true
          description: The staff member's name; empty for actions the system took.
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        details:
          type: string
        occurredAt:
          type: string
          format: date-time

    AuditList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
